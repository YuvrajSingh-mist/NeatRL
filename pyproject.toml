[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "neatrl"
version = "2.5.6"
description = "A Python library for reinforcement learning algorithms"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
  { name = "Yuvraj Singh", email = "yuvraj.mist@gmail.com" }
]

dependencies = [
    "torch",
    "numpy",
    # classic-control envs (CartPole, Pendulum, Acrobot, MountainCar) plus the
    # pygame-ce module they render with. gymnasium's classic-control extra is
    # pygame-ce, not pygame, so this does not collide with the pin below.
    "gymnasium[classic-control]>=1.3.0",
    "pygame-ce>=2.1.3",
    "stable-baselines3",
    "tqdm",
    "wandb[media]",
    "imageio[ffmpeg]",
    "opencv-python",
    # The terminal dashboard. Bundled rather than optional so that a plain
    # `pip install neatrl` shows the TUI instead of silently logging.
    "rich",
    "psutil",
    "nvidia-ml-py",
]

[project.optional-dependencies]
# Environment families that need a heavier native dependency stay opt-in.
atari = ["gymnasium[atari]", "ale-py"]
# `ale` is the same thing spelled after the namespace it registers.
ale = ["gymnasium[atari]", "ale-py"]
box2d = ["gymnasium[box2d]"]
mujoco = ["gymnasium[mujoco]"]
# Kept so existing instructions and scripts keep working; the dashboard and
# classic control now ship in the base install.
cli = ["rich", "psutil", "nvidia-ml-py"]
classic = ["gymnasium[classic-control]"]
# Everything the `neatrl train` aliases can reach, including the image-based
# `-cnn` ones (ALE for Pong/Breakout, Box2D for CarRacing).
all = [
    "rich",
    "psutil",
    "nvidia-ml-py",
    "ale-py",
    "gymnasium[atari,classic-control,box2d,mujoco]",
]
dev = [
    "ruff",
    "mypy",
    "black",
    "build",
    "twine",
    "rich",
    "psutil",
    "nvidia-ml-py",
    # The fast test suite runs in CI from this extra, so it has to be here.
    "pytest>=8.4.2",
]

[project.scripts]
neatrl = "neatrl.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["neatrl*"]

[tool.ruff]
line-length = 88
target-version = "py39"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501", # line too long, handled by black
    "B008", # do not perform function calls in argument defaults
    "C901", # too complex
]

[tool.ruff.lint.per-file-ignores]
# ``__init__.py`` filters a deprecation warning before importing the submodules,
# so the imports deliberately follow that call; E402 does not apply.
"__init__.py" = ["F401", "E402"]

[tool.ruff.lint.isort]
# Training runs drop a ``wandb/`` directory in the repo root, which ruff would
# otherwise classify as a first-party package. Pin it so the import order is the
# same in a fresh checkout (where CI runs) as on a machine that has been
# training. Without this, a local ``ruff check`` passes while CI fails I001.
known-third-party = ["wandb"]

[dependency-groups]
dev = [
    "mypy>=1.19.0",
    "psutil>=7.1.3",
    "pyright>=1.1.411",
    "pytest>=8.4.2",
    "rich>=14.2.0",
    "ruff>=0.14.9",
]

